[project]
name = "qa-policy-agent"
version = "0.1.0"
description = "RAG-based banking policy Q&A agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langchain-aws",
    "chromadb",
    "httpx",
    "pydantic-settings",
    "pyyaml",
    "boto3",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_policy_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
